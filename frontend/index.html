<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#0f172a">
    <link rel="dns-prefetch" href="http://localhost:8080">
        <meta name="description" content="Prenota il tuo veicolo smart in pochi secondi. Auto, monopattini e biciclette disponibili a Bari.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mobility - Prenota Veicolo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE" class="active">Prenota Veicolo</a>
        <a href="mappa.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Mappa</a>
        <a href="pagamento.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Pagamenti</a>
        <a href="assistenza.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Assistenza</a>
        <a href="dashboard.html" data-role="OPERATORE,AMMINISTRATORE">Dashboard Operatore</a>
        <a href="storico.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Storico Noleggi</a>
        <a href="gestione_ticket.html" data-role="OPERATORE,AMMINISTRATORE">Gestione Ticket</a>
        <a href="gestione_utenti.html" data-role="OPERATORE,AMMINISTRATORE">Gestione Utenti</a>
        <a href="statistiche.html" data-role="AMMINISTRAZIONE_PUBBLICA">Statistiche PA</a>
    </nav>

    <!-- Effetti di sfondo animati -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <h1>Smart Mobility</h1>
        <p class="subtitle">Prenota il tuo veicolo in un istante</p>

        <div class="input-group">
            <input type="email" id="email" placeholder=" " required autocomplete="off">
            <label for="email">Indirizzo Email</label>
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
        </div>

        <div class="input-group">
            <input type="text" id="codiceVeicolo" placeholder=" " required autocomplete="off">
            <label for="codiceVeicolo">Codice Veicolo (es. AUTO-001)</label>
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <div class="input-group">
            <input type="text" id="destinazione" placeholder=" " required autocomplete="off">
            <label for="destinazione">Destinazione (es. Via Sparano)</label>
            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
        </div>

        <button id="preventivoBtn" onclick="calcolaPreventivo()" style="background: rgba(255,255,255,0.1); color: white; margin-bottom: 10px;">
            <span>Calcola Preventivo</span>
        </button>
        <div id="preventivoResult" style="display: none; text-align: center; color: var(--primary); font-size: 1.2rem; margin-bottom: 15px; font-weight: bold;"></div>

        <!-- SEZIONE PROMOZIONI -->
        <div class="input-group" style="display: flex; gap: 10px; margin-bottom: 20px;">
            <div style="flex-grow: 1; position: relative;">
                <input type="text" id="codicePromozione" placeholder=" " autocomplete="off" style="text-transform: uppercase;">
                <label for="codicePromozione">Codice Sconto (Opzionale)</label>
            </div>
            <button id="promoBtn" onclick="verificaPromozione()" style="width: auto; padding: 0 15px; background: rgba(0, 255, 136, 0.2); color: var(--primary); border: 1px solid var(--primary);">
                Verifica
            </button>
        </div>
        <div id="promoMessage" style="display: none; text-align: center; font-size: 0.9rem; margin-top: -15px; margin-bottom: 15px;"></div>

        <button id="bookBtn" onclick="prenotaVeicolo()">
            <span id="btnText">Prenota Ora</span>
            <div id="btnLoader" class="loader"></div>
        </button>

        <div id="responseDiv"></div>
    </div>

    <script>
        let preventivoBase = 0;
        let scontoAttivo = 0;
        let codiceScontoAttivo = null;

        window.onload = function() {
            // Estrae il parametro 'codice' dall'URL se presente
            const urlParams = new URLSearchParams(window.location.search);
            const codice = urlParams.get('codice');
            
            if (codice) {
                const codiceInput = document.getElementById('codiceVeicolo');
                codiceInput.value = codice;
                codiceInput.readOnly = true;
                
                // Evidenzia visivamente che il campo è precompilato
                codiceInput.style.backgroundColor = 'rgba(0, 255, 136, 0.05)';
                codiceInput.style.borderColor = 'var(--primary)';
            }
        };

        function aggiornaUIPreventivo() {
            const preventivoResult = document.getElementById('preventivoResult');
            if (preventivoBase > 0) {
                let totale = preventivoBase - scontoAttivo;
                if (totale < 0) totale = 0;
                
                if (scontoAttivo > 0) {
                    preventivoResult.innerHTML = `Costo Stimato: <span style="text-decoration: line-through; color: var(--text-muted); font-size: 0.9rem;">€${preventivoBase.toFixed(2)}</span> <strong style="color: #00ff88;">€${totale.toFixed(2)}</strong><br><span style="font-size:0.8rem; color:#00ff88;">Sconto applicato: -€${scontoAttivo.toFixed(2)}</span>`;
                } else {
                    preventivoResult.innerHTML = `Costo Stimato: <strong>€${preventivoBase.toFixed(2)}</strong>`;
                }
            }
        }

        async function verificaPromozione() {
            const codice = document.getElementById('codicePromozione').value.trim().toUpperCase();
            const promoMessage = document.getElementById('promoMessage');
            
            if (!codice) {
                promoMessage.textContent = 'Inserisci un codice valido.';
                promoMessage.style.color = '#ff4d6d';
                promoMessage.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('http://localhost:8080/api/promozione/valida', {
                    method: 'POST',
                    headers: getAuthJsonHeaders(),
                    body: JSON.stringify({ codice: codice })
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    scontoAttivo = data.sconto;
                    codiceScontoAttivo = codice;
                    promoMessage.textContent = `Promozione applicata! Sconto di €${data.sconto.toFixed(2)}`;
                    promoMessage.style.color = '#00ff88';
                    promoMessage.style.display = 'block';
                    aggiornaUIPreventivo();
                } else {
                    scontoAttivo = 0;
                    codiceScontoAttivo = null;
                    promoMessage.textContent = data.message || 'Codice non valido.';
                    promoMessage.style.color = '#ff4d6d';
                    promoMessage.style.display = 'block';
                    aggiornaUIPreventivo();
                }
            } catch (error) {
                promoMessage.textContent = 'Errore di rete durante la verifica.';
                promoMessage.style.color = '#ff4d6d';
                promoMessage.style.display = 'block';
            }
        }

        async function calcolaPreventivo() {
            const codiceVeicolo = document.getElementById('codiceVeicolo').value.trim();
            const destinazione = document.getElementById('destinazione').value.trim();
            const preventivoResult = document.getElementById('preventivoResult');

            if (!codiceVeicolo || !destinazione) {
                showResponse('error', 'Inserisci codice veicolo e destinazione per il preventivo.');
                return;
            }

            preventivoResult.style.display = 'block';
            preventivoResult.textContent = 'Calcolo in corso...';
            preventivoResult.style.color = 'var(--text-muted)';

            try {
                // Geocoding della destinazione tramite Nominatim (OpenStreetMap)
                const geocodeUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(destinazione + ', Bari')}&limit=1`;
                const geoRes = await fetch(geocodeUrl);
                const geoData = await geoRes.json();

                if (geoData.length === 0) {
                    showResponse('error', 'Destinazione non trovata. Inserisci un indirizzo valido a Bari.');
                    preventivoResult.style.display = 'none';
                    return;
                }

                const destLat = geoData[0].lat;
                const destLon = geoData[0].lon;

                // Chiama il backend con le coordinate della destinazione
                const response = await fetch(`http://localhost:8080/api/preventivo?codiceVeicolo=${codiceVeicolo}&lat=${destLat}&lon=${destLon}`);
                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    preventivoBase = data.preventivo;
                    preventivoResult.style.color = 'var(--primary)';
                    aggiornaUIPreventivo();
                    preventivoResult.innerHTML += `<br><span style="font-size:0.9rem; color:var(--text-muted);">Distanza: ${data.distanza.toFixed(2)} km - Tempo: ${data.minuti} min</span>`;
                } else {
                    showResponse('error', `Errore preventivo: ${data.message}`);
                    preventivoResult.style.display = 'none';
                }
            } catch (error) {
                console.error(error);
                showResponse('error', 'Errore durante il calcolo del preventivo.');
                preventivoResult.style.display = 'none';
            }
        }

        async function prenotaVeicolo() {
            // Lettura valori dagli input
            const email = document.getElementById('email').value.trim();
            const codiceVeicolo = document.getElementById('codiceVeicolo').value.trim();
            
            // Elementi UI
            const responseDiv = document.getElementById('responseDiv');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const button = document.getElementById('bookBtn');

            // Reset UI stato precedente
            responseDiv.className = '';
            responseDiv.classList.remove('show');
            
            // Validazione base
            if (!email || !codiceVeicolo) {
                showResponse('error', 'Compila tutti i campi richiesti.');
                return;
            }

            // Attivazione stato di caricamento (animazione bottone)
            btnText.style.display = 'none';
            btnLoader.style.display = 'block';
            button.disabled = true;

            // Costruzione dell'oggetto JSON
            const requestBody = {
                email: email,
                codiceVeicolo: codiceVeicolo
            };

            if (codiceScontoAttivo) {
                requestBody.promozione = codiceScontoAttivo;
            }

            try {
                // Richiesta fetch verso l'API Backend Java
                const response = await fetch('http://localhost:8080/api/prenota', {
                    method: 'POST',
                    headers: getAuthJsonHeaders(),
                    body: JSON.stringify(requestBody)
                });

                // Gestione della risposta
                const data = await response.json();

                if (!response.ok) {
                    if (data.message && data.message.includes('Metodo di pagamento mancante')) {
                        showResponse('error', `✖ ${data.message} Clicca su 'Pagamenti' in alto.`);
                    } else {
                        showResponse('error', `✖ Errore: ${data.message || 'Veicolo non disponibile o operazione fallita'}`);
                    }
                } else if (data.status === 'success') {
                    showResponse('success', `✔ ${data.message}`);
                } else {
                    showResponse('error', `✖ Errore: ${data.message || 'Prenotazione fallita'}`);
                }
            } catch (error) {
                console.error('Errore nella fetch:', error);
                showResponse('error', '✖ Errore di connessione. Il server è avviato?');
            } finally {
                // Ripristino del bottone
                btnText.style.display = 'block';
                btnLoader.style.display = 'none';
                button.disabled = false;
            }
        }

        // Funzione helper per le animazioni del banner di risposta
        function showResponse(type, message) {
            const responseDiv = document.getElementById('responseDiv');
            responseDiv.textContent = message;
            responseDiv.className = type; // Assegna classe 'success' o 'error'
            
            // Trigger reflow per forzare l'animazione CSS
            void responseDiv.offsetWidth;
            responseDiv.classList.add('show');
        }
    </script>
    <script src="AuthGuard.js"></script>
</body>
</html>
