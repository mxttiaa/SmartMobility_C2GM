<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mobility - Dashboard Veicoli</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="AuthGuard.js"></script>
    <style>
        /* Overriding flex alignment for dashboard layout */
        body {
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Prenota Veicolo</a>
        <a href="mappa.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Mappa</a>
        <a href="pagamento.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Pagamenti</a>
        <a href="assistenza.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Assistenza</a>
        <a href="dashboard.html" data-role="OPERATORE,AMMINISTRATORE" class="active">Dashboard Operatore</a>
        <a href="storico.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Storico Noleggi</a>
    </nav>

    <div class="blob blob-1" style="top: -50px; left: -50px;"></div>
    <div class="blob blob-2" style="bottom: auto; top: 200px; right: -50px;"></div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="dashboard-title">
            <h1>Veicoli Disponibili</h1>
            <p class="subtitle">Scegli e prenota il veicolo più adatto alle tue esigenze</p>
        </div>

        <div id="veicoli-container" class="veicoli-grid">
            <!-- Loading indicator -->
            <div id="loadingIndicator" style="text-align: center; grid-column: 1 / -1;">
                <div class="loader" style="display: block; border-top-color: var(--primary);"></div>
                <p style="margin-top: 10px; color: var(--text-muted);">Caricamento veicoli in corso...</p>
            </div>
        </div>
    </div>

    <script>
        window.onload = async function() {
            const container = document.getElementById('veicoli-container');
            const loader = document.getElementById('loadingIndicator');

            try {
                const response = await fetch('http://localhost:8080/api/veicoli', {
                    headers: window.getAuthHeaders()
                });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const veicoli = await response.json();
                
                // Rimuovi loader
                loader.style.display = 'none';

                if (veicoli.length === 0) {
                    container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: var(--text-muted);">Nessun veicolo disponibile al momento.</p>';
                    return;
                }

                // Generazione dinamica delle card
                veicoli.forEach(veicolo => {
                    const card = document.createElement('div');
                    card.className = 'veicolo-card';

                    // Colore badge in base allo stato
                    let badgeColor = 'rgba(0, 255, 136, 0.1)';
                    let textColor = 'var(--primary)';
                    if (veicolo.stato !== 'DISPONIBILE') {
                        badgeColor = 'rgba(255, 50, 100, 0.1)';
                        textColor = '#ff4d6d';
                    }

                    card.innerHTML = `
                        <h3>${veicolo.modello}</h3>
                        <p>Codice: <strong>${veicolo.codice}</strong></p>
                        <span class="badge" style="background: ${badgeColor}; color: ${textColor};">${veicolo.stato}</span>
                        <button onclick="prenota('${veicolo.codice}')" ${veicolo.stato !== 'DISPONIBILE' ? 'disabled' : ''}>
                            Prenota
                        </button>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Errore nel recupero dei veicoli:', error);
                loader.innerHTML = '<p style="color: #ff4d6d;">Impossibile caricare i veicoli. Verifica che il server sia acceso.</p>';
            }
        };

        function prenota(codice) {
            console.log("Prenotazione veicolo:", codice);
            window.location.href = "index.html?codice=" + codice;
        }
    </script>
</body>
</html>
