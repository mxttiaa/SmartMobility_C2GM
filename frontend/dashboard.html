<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#0f172a">
    <link rel="dns-prefetch" href="http://localhost:8080">
        <meta name="description" content="Dashboard operatore Smart Mobility: gestione veicoli e prenotazioni.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Mobility - Dashboard Veicoli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Overriding flex alignment for dashboard layout */
        body {
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Prenota Veicolo</a>
        <a href="mappa.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Mappa</a>
        <a href="pagamento.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Pagamenti</a>
        <a href="assistenza.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Assistenza</a>
        <a href="dashboard.html" data-role="OPERATORE,AMMINISTRATORE" class="active">Dashboard Operatore</a>
        <a href="storico.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Storico Noleggi</a>
        <a href="gestione_ticket.html" data-role="OPERATORE,AMMINISTRATORE">Gestione Ticket</a>
        <a href="gestione_utenti.html" data-role="OPERATORE,AMMINISTRATORE">Gestione Utenti</a>
        <a href="statistiche.html" data-role="AMMINISTRAZIONE_PUBBLICA">Statistiche PA</a>
    </nav>

    <div class="blob blob-1" style="top: -50px; left: -50px;"></div>
    <div class="blob blob-2" style="bottom: auto; top: 200px; right: -50px;"></div>

    <div style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="dashboard-title">
            <h1>Veicoli Disponibili</h1>
            <p class="subtitle">Scegli e prenota il veicolo più adatto alle tue esigenze</p>
        </div>

        <div id="veicoli-container" class="veicoli-grid">
            <!-- Loading indicator -->
            <div id="loadingIndicator" style="text-align: center; grid-column: 1 / -1;">
                <div class="loader" style="display: block; border-top-color: var(--primary);"></div>
                <p style="margin-top: 10px; color: var(--text-muted);">Caricamento veicoli in corso...</p>
            </div>
        </div>
    </div>

    <script>
        window.onload = async function() {
            const container = document.getElementById('veicoli-container');
            const loader = document.getElementById('loadingIndicator');

            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000);

            try {
                const response = await fetch('http://localhost:8080/api/veicoli', {
                    headers: window.getAuthHeaders(),
                    signal: controller.signal
                });
                clearTimeout(timeout);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const veicoli = await response.json();
                
                loader.style.display = 'none';

                if (veicoli.length === 0) {
                    container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: var(--text-muted);">Nessun veicolo disponibile al momento.</p>';
                    return;
                }

                // Build all cards in a fragment — single DOM reflow
                const fragment = document.createDocumentFragment();
                veicoli.forEach(veicolo => {
                    const card = document.createElement('div');
                    card.className = 'veicolo-card';

                    const isDisponibile = veicolo.stato === 'DISPONIBILE';
                    const badgeColor = isDisponibile ? 'rgba(0, 255, 136, 0.1)' : 'rgba(255, 50, 100, 0.1)';
                    const textColor  = isDisponibile ? 'var(--primary)' : '#ff4d6d';

                    card.innerHTML = `
                        <h3>${veicolo.modello}</h3>
                        <p>Codice: <strong>${veicolo.codice}</strong></p>
                        <span class="badge" style="background: ${badgeColor}; color: ${textColor};">${veicolo.stato}</span>
                        <button onclick="prenota('${veicolo.codice}')" ${!isDisponibile ? 'disabled' : ''}>
                            Prenota
                        </button>
                    `;
                    fragment.appendChild(card);
                });

                loader.remove(); // clean up loader node entirely
                container.appendChild(fragment);

            } catch (error) {
                clearTimeout(timeout);
                const msg = error.name === 'AbortError'
                    ? 'Timeout: il server non risponde.'
                    : 'Impossibile caricare i veicoli. Verifica che il server sia acceso.';
                console.error('Errore nel recupero dei veicoli:', error);
                loader.innerHTML = `<p style="color: #ff4d6d;">${msg}</p>`;
            }
        };

        function prenota(codice) {
            window.location.href = 'index.html?codice=' + codice;
        }
    </script>
    <script src="AuthGuard.js"></script>
</body>
</html>
