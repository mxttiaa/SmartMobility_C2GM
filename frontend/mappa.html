<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Veicoli - Smart Mobility</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="style.css">
    <script src="AuthGuard.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }

        .navbar {
            margin: 20px;
            z-index: 1000;
        }

        #map-container {
            flex: 1;
            width: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .map-filters {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(18, 18, 20, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            z-index: 1000;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 200px;
        }

        .map-filters h3 {
            margin-top: 0;
            font-size: 16px;
            margin-bottom: 10px;
            color: var(--primary);
        }

        .filter-group {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group input {
            cursor: pointer;
        }

        .leaflet-popup-content-wrapper {
            background: #1e1e24;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .leaflet-popup-tip {
            background: #1e1e24;
        }

        .leaflet-popup-content {
            margin: 15px;
        }

        .leaflet-popup-content h4 {
            margin: 0 0 5px 0;
            color: var(--primary);
        }

        .leaflet-popup-content p {
            margin: 5px 0;
            font-size: 13px;
        }

        .popup-btn {
            background: var(--primary);
            color: #121214;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .popup-btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .popup-btn:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Prenota Veicolo</a>
        <a href="mappa.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Mappa</a>
        <a href="dashboard.html" data-role="OPERATORE,AMMINISTRATORE">Dashboard Operatore</a>
        <a href="storico.html" data-role="CLIENTE,OPERATORE,AMMINISTRATORE">Storico Noleggi</a>
    </nav>

    <div id="map-container">
        <div id="map"></div>
        <div class="map-filters">
            <h3>Filtra Veicoli</h3>
            <div class="filter-group">
                <input type="checkbox" id="filter-auto" checked onchange="applicaFiltri()">
                <label for="filter-auto">Automobile</label>
            </div>
            <div class="filter-group">
                <input type="checkbox" id="filter-mono" checked onchange="applicaFiltri()">
                <label for="filter-mono">Monopattino</label>
            </div>
            <div class="filter-group">
                <input type="checkbox" id="filter-bici" checked onchange="applicaFiltri()">
                <label for="filter-bici">Bicicletta</label>
            </div>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 10px 0;">
            <div class="filter-group">
                <input type="checkbox" id="filter-available" onchange="applicaFiltri()">
                <label for="filter-available">Solo Disponibili</label>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        let map;
        let markers = [];
        let allVeicoli = [];

        window.onload = async function() {
            // Inizializza mappa (centro di default: Roma)
            map = L.map('map').setView([41.9028, 12.4964], 13);

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 20
            }).addTo(map);

            // Prova a centrare sulla posizione utente se disponibile
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(position => {
                    map.setView([position.coords.latitude, position.coords.longitude], 14);
                }, error => {
                    console.log("Geolocalizzazione non permessa o non disponibile");
                });
            }

            caricaVeicoli();
        };

        async function caricaVeicoli() {
            try {
                const response = await fetch('http://localhost:8080/api/veicoli', {
                    headers: window.getAuthHeaders()
                });
                
                if (!response.ok) {
                    throw new Error("Errore API");
                }
                
                allVeicoli = await response.json();
                applicaFiltri();
            } catch (error) {
                console.error("Impossibile caricare veicoli:", error);
            }
        }

        function applicaFiltri() {
            // Pulisci i marker esistenti
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];

            const showAuto = document.getElementById('filter-auto').checked;
            const showMono = document.getElementById('filter-mono').checked;
            const showBici = document.getElementById('filter-bici').checked;
            const onlyAvailable = document.getElementById('filter-available').checked;

            allVeicoli.forEach(veicolo => {
                if (!showAuto && veicolo.modello === 'Automobile') return;
                if (!showMono && veicolo.modello === 'Monopattino') return;
                if (!showBici && veicolo.modello === 'Bicicletta') return;
                if (onlyAvailable && veicolo.stato !== 'DISPONIBILE') return;

                // Aggiungi marker
                let color = '#00ff88'; // DISPONIBILE
                if (veicolo.stato === 'IN_USO') color = '#ff4d6d';
                else if (veicolo.stato === 'IN_MANUTENZIONE' || veicolo.stato === 'BATTERIA_SCARICA') color = '#ffb800';

                const markerHtmlStyles = `
                    background-color: ${color};
                    width: 15px;
                    height: 15px;
                    display: block;
                    border-radius: 50%;
                    border: 2px solid white;
                    box-shadow: 0 0 10px ${color};
                `;

                const icon = L.divIcon({
                    className: "custom-pin",
                    iconAnchor: [9, 9],
                    html: `<span style="${markerHtmlStyles}" />`
                });

                const lat = veicolo.latitudine || 41.9028 + (Math.random() - 0.5) * 0.1;
                const lng = veicolo.longitudine || 12.4964 + (Math.random() - 0.5) * 0.1;

                const marker = L.marker([lat, lng], {icon: icon}).addTo(map);
                
                const popupContent = `
                    <h4>${veicolo.modello} - ${veicolo.codice}</h4>
                    <p><strong>Stato:</strong> ${veicolo.stato}</p>
                    <p><strong>Batteria:</strong> ${veicolo.livelloCarica.toFixed(1)}%</p>
                    <p><strong>Autonomia:</strong> ${veicolo.autonomiaStimata.toFixed(1)} km</p>
                    <button class="popup-btn" onclick="window.location.href='index.html?codice=${veicolo.codice}'" ${veicolo.stato !== 'DISPONIBILE' ? 'disabled' : ''}>
                        ${veicolo.stato === 'DISPONIBILE' ? 'Prenota Ora' : 'Non Disponibile'}
                    </button>
                `;

                marker.bindPopup(popupContent);
                markers.push(marker);
            });
        }
    </script>
</body>
</html>
